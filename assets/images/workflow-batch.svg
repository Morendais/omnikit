<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Step 1: Input Card -->
  <g transform="translate(30, 20)" filter="url(#cardShadow)">
    <rect width="240" height="150" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1.5"/>
    <!-- Folder Icon -->
    <rect x="22" y="24" width="40" height="40" rx="10" fill="#6366f1" fill-opacity="0.15"/>
    <path d="M33 38h4l2 3h9a2 2 0 012 2v9a2 2 0 01-2 2H33a2 2 0 01-2-2v-12a2 2 0 012-2z" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    
    <text x="74" y="42" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">1. Drag &amp; Drop</text>
    <text x="74" y="58" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">100+ Photos or Folders</text>
    
    <line x1="22" y1="78" x2="218" y2="78" stroke="#21262d" stroke-width="1"/>
    
    <rect x="22" y="94" width="70" height="20" rx="4" fill="#21262d"/>
    <text x="57" y="108" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">RAW / PNG</text>
    
    <rect x="98" y="94" width="56" height="20" rx="4" fill="#21262d"/>
    <text x="126" y="108" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">JPG</text>

    <rect x="160" y="94" width="58" height="20" rx="4" fill="#21262d"/>
    <text x="189" y="108" text-anchor="middle" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="500">WebP</text>

    <text x="22" y="136" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Zero server upload, instant read</text>
  </g>

  <!-- Flow Arrow 1 -->
  <g transform="translate(290, 85)">
    <path d="M0 10 H35" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28 3 L35 10 L28 17" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Step 2: Processing Engine Card -->
  <g transform="translate(345, 20)" filter="url(#cardShadow)">
    <rect width="250" height="150" rx="12" fill="#161b22" stroke="#6366f1" stroke-width="1.5"/>
    <!-- CPU / Processing Chip Icon -->
    <rect x="22" y="24" width="40" height="40" rx="10" fill="#a855f7" fill-opacity="0.15"/>
    <rect x="34" y="36" width="16" height="16" rx="2" stroke="#c084fc" stroke-width="2" fill="none"/>
    <path d="M38 31v5 M46 31v5 M38 52v5 M46 52v5 M29 38h5 M29 46h5 M50 38h5 M50 46h5" stroke="#c084fc" stroke-width="1.8" stroke-linecap="round"/>

    <text x="74" y="42" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">2. In-Browser Core</text>
    <text x="74" y="58" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">Web Workers &amp; Canvas</text>

    <line x1="22" y1="78" x2="228" y2="78" stroke="#21262d" stroke-width="1"/>

    <text x="22" y="102" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500">Target Size: 200 KB</text>
    <text x="22" y="120" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Iterative binary quality tuner</text>
    <text x="22" y="136" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Watermarking &amp; EXIF stripping</text>
  </g>

  <!-- Flow Arrow 2 -->
  <g transform="translate(615, 85)">
    <path d="M0 10 H35" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M28 3 L35 10 L28 17" stroke="url(#accentGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>

  <!-- Step 3: Output Card -->
  <g transform="translate(670, 20)" filter="url(#cardShadow)">
    <rect width="200" height="150" rx="12" fill="#161b22" stroke="#10b981" stroke-width="1.5"/>
    <!-- Archive Box Icon -->
    <rect x="22" y="24" width="40" height="40" rx="10" fill="#10b981" fill-opacity="0.15"/>
    <path d="M32 35h20v5H32z M34 40v12a2 2 0 002 2h12a2 2 0 002-2V40 M39 45h6" stroke="#34d399" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

    <text x="74" y="42" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="600">3. Instant ZIP</text>
    <text x="74" y="58" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12">1-Click Local Save</text>

    <line x1="22" y1="78" x2="178" y2="78" stroke="#21262d" stroke-width="1"/>

    <rect x="22" y="94" width="100" height="22" rx="4" fill="#047857" fill-opacity="0.2" stroke="#10b981" stroke-width="1"/>
    <text x="72" y="109" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600">100% Client-Side</text>

    <text x="22" y="136" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11">Zero latency, no queue</text>
  </g>
</svg>