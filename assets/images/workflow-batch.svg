<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 200" width="100%" height="auto" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-10%" width="110%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="200" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5"/>

  <!-- Step 1 Card: Drop Files -->
  <g transform="translate(35, 30)" filter="url(#shadow)">
    <rect width="230" height="140" rx="12" fill="#1e293b" stroke="#475569" stroke-width="1.2"/>
    <circle cx="45" cy="45" r="22" fill="#6366f1" fill-opacity="0.15"/>
    <path d="M45 35v14m-7-7l7-7 7 7" stroke="#818cf8" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="35" y="49" width="20" height="6" rx="2" fill="#818cf8"/>
    <text x="80" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700">1. Drag &amp; Drop</text>
    <text x="80" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">100+ Photos or Folders</text>
    <path d="M25 85h180" stroke="#334155" stroke-width="1"/>
    <text x="25" y="108" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">⚡ Zero Cloud Uploads</text>
    <text x="25" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10">RAW, HEIC, PNG, JPG, WebP</text>
  </g>

  <!-- Arrow 1 -->
  <g transform="translate(285, 90)">
    <path d="M0 10h40m-10-8l8 8-8 8" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 2 Card: Local Processing -->
  <g transform="translate(345, 30)" filter="url(#shadow)">
    <rect width="230" height="140" rx="12" fill="#1e293b" stroke="#6366f1" stroke-width="1.5"/>
    <circle cx="45" cy="45" r="22" fill="#8b5cf6" fill-opacity="0.15"/>
    <path d="M38 45h14m-7-7v14m-6-10l12 12" stroke="#a78bfa" stroke-width="2.2" stroke-linecap="round"/>
    <text x="80" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700">2. In-Browser Core</text>
    <text x="80" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">Web Workers + Canvas</text>
    <path d="M25 85h180" stroke="#334155" stroke-width="1"/>
    <text x="25" y="108" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">⚙️ Exact 200 KB Target Size</text>
    <text x="25" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10">Resize, Watermark &amp; Compress</text>
  </g>

  <!-- Arrow 2 -->
  <g transform="translate(595, 90)">
    <path d="M0 10h40m-10-8l8 8-8 8" stroke="url(#accentGrad)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Step 3 Card: Instant ZIP -->
  <g transform="translate(655, 30)" filter="url(#shadow)">
    <rect width="190" height="140" rx="12" fill="#1e293b" stroke="#10b981" stroke-width="1.2"/>
    <circle cx="45" cy="45" r="22" fill="#10b981" fill-opacity="0.15"/>
    <path d="M38 42l5 5 9-9" stroke="#34d399" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="80" y="42" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="14" font-weight="700">3. Instant ZIP</text>
    <text x="80" y="58" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11">Single Click Download</text>
    <path d="M25 85h140" stroke="#334155" stroke-width="1"/>
    <text x="25" y="108" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="600">✓ 100% Client-Side</text>
    <text x="25" y="125" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="10">No waitlists, no limits</text>
  </g>
</svg>
