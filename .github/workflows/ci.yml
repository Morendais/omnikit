name: OmniKit CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [18.x, 20.x, 22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify zero external dependencies
        shell: bash
        run: |
          node -e "const pkg = require('./package.json'); if (pkg.dependencies && Object.keys(pkg.dependencies).length > 0) { console.error('Dependencies must remain zero'); process.exit(1); }"

      - name: Run Core Test Suite
        run: node test.js

      - name: Validate Module Exports & Tree-Shaking
        shell: bash
        run: |
          node -e "const OmniKit = require('./index.js'); console.log('Loaded tools count:', Object.keys(OmniKit.tools || {}).length);"
